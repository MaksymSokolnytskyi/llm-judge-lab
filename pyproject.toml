[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "judgelab"
version = "0.1.0"
description = "Measuring LLM-as-judge bias with local models: they generate, rewrite and grade each other."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Maksym Sokolnytskyi" }]
dependencies = [
  "pydantic>=2.6",
  "requests>=2.31",
]

[project.optional-dependencies]
data = ["datasets>=2.19"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/judgelab"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic in prompts and test fixtures is intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
